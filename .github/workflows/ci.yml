name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend
      - name: Tests
        run: pytest -q
      - name: Evaluation smoke test
        run: cd backend && python evaluate.py --quick

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fraudsentinel .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name fs -p 8000:8000 fraudsentinel
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && exit 0; sleep 2; done
          docker logs fs; exit 1
